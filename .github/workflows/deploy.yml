name: Deploy

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.VERSION }}

      - name: Build and push frontend image
        id: frontend-image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.VERSION }}

      - name: Build and push deterministic mock-AI image
        id: mock-ai-image
        uses: docker/build-push-action@v5
        with:
          context: ./e2e/mock-ai
          push: true
          tags: ghcr.io/${{ github.repository }}/mock-ai:${{ steps.tag.outputs.VERSION }}

      - name: Write staging manifest
        run: |
          mkdir -p staging-manifest
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg backendDigest "${{ steps.backend-image.outputs.digest }}" \
            --arg frontendDigest "${{ steps.frontend-image.outputs.digest }}" \
            --arg mockAiDigest "${{ steps.mock-ai-image.outputs.digest }}" \
            --arg migrationHead "$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -1)" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, backendDigest: $backendDigest, frontendDigest: $frontendDigest, mockAiDigest: $mockAiDigest, migrationHead: $migrationHead, createdAt: $createdAt}' \
            > staging-manifest/deployment-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-manifest
          path: staging-manifest/deployment-manifest.json

  deploy-staging:
    name: Deploy to staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-deployment-manifest
          path: staging-manifest

      - name: Validate staging configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          STAGING_E2E_REGISTRATION_KEY: ${{ secrets.STAGING_E2E_REGISTRATION_KEY }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_SSH_USER"
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          test -n "$STAGING_GHCR_TOKEN"
          test -n "$STAGING_E2E_REGISTRATION_KEY"
          test -n "$STAGING_URL"

      - name: Deploy immutable manifest
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$STAGING_GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$STAGING_SSH_USER@$STAGING_HOST" \
            'docker login ghcr.io --username QZSAMA --password-stdin'
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes staging-manifest/deployment-manifest.json \
            "$STAGING_SSH_USER@$STAGING_HOST:/tmp/homefinance-deployment-manifest.json"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$STAGING_SSH_USER@$STAGING_HOST" \
            'sudo /opt/homefinance-staging/deploy.sh /tmp/homefinance-deployment-manifest.json && rm -f /tmp/homefinance-deployment-manifest.json'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify staging critical journeys
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          E2E_REGISTRATION_KEY: ${{ secrets.STAGING_E2E_REGISTRATION_KEY }}
        run: npx playwright test

      - name: Promote verified staging candidate
        if: success()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$STAGING_SSH_USER@$STAGING_HOST" 'sudo /opt/homefinance-staging/promote.sh'

      - name: Collect VPS diagnostics after deployment or E2E failure
        if: failure()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          mkdir -p staging-evidence
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes "$STAGING_SSH_USER@$STAGING_HOST:/opt/homefinance-staging/evidence/*" staging-evidence/ || true

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-artifacts-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
            staging-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-evidence-${{ github.run_id }}
          path: staging-manifest/deployment-manifest.json
          retention-days: 30
