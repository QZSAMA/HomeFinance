name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:latest

      - name: Resolve image digests
        id: digest
        run: |
          echo "backend=$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.VERSION }} --format '{{json .Manifest.Digest}}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.VERSION }} --format '{{json .Manifest.Digest}}' | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Write staging manifest
        run: |
          mkdir -p staging-manifest
          cat > staging-manifest/deployment-manifest.json <<EOF
          {"commit":"${GITHUB_SHA}","backendDigest":"${{ steps.digest.outputs.backend }}","frontendDigest":"${{ steps.digest.outputs.frontend }}","migrationHead":"$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -1)","createdAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-manifest
          path: staging-manifest/deployment-manifest.json
